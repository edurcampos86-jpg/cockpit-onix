# Railway cron schedules para o Painel do Dia
#
# Todos horários em UTC (Bahia = UTC-3, sem horário de verão).
#
# Crons disparam HTTP GET contra as rotas /api/cron/* com o header
# Authorization: Bearer $CRON_SECRET. Se CRON_SECRET estiver vazio,
# cron-guard.ts libera (modo dev).

# Builder fixado em DOCKERFILE pra instalar postgresql-client-16 (pg_dump) no
# runtime. NÃO usar Nixpacks (quebra: nixPkgs sobrescreve o node). Ver Dockerfile.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "npm run start"
# Migrations rodam AQUI, não dentro do `start`.
#
# Antes: `start = "prisma migrate deploy && next start"`. O `&&` amarrava as
# duas coisas ao mesmo destino — uma migration que falhasse não parava a
# migration, parava o `next start`, e o serviço entrava em loop de restart até
# alguém corrigir. O container reinicia, a migration falha de novo, e o app
# nunca sobe. Falha de dado virava indisponibilidade.
#
# Agora são etapas separadas, e a diferença é o que acontece no erro:
#
#   preDeployCommand falha  → o deploy NÃO é promovido; a versão anterior
#                             segue no ar, servindo tráfego, com o banco
#                             intacto. O erro aparece nos logs do deploy.
#   startCommand falha      → aí sim é problema do app, e é o que restart
#                             policy existe para tratar.
#
# O pré-deploy roda no container da imagem NOVA, depois do build e antes de
# qualquer tráfego, com as mesmas variáveis do serviço (então `DATABASE_URL`
# está lá). Roda uma vez por deploy, não por réplica.
#
# O script se chama `db:migrate`, e não `predeploy`, por causa de uma pegadinha
# do npm: um script chamado `predeploy` é interpretado como hook automático de
# um script `deploy`. Não existe `deploy` hoje, então funcionaria — e passaria
# a se comportar diferente no dia em que alguém criasse um. `db:migrate` segue
# a convenção que o arquivo já usa (`db:push`, `db:seed`).
preDeployCommand = "npm run db:migrate"
# Fixado em 1 réplica: o scheduler in-process do poll DataCrazy
# (src/instrumentation.ts) assume 1 instância. Com >1 réplica cada uma
# registraria o cron → polls concorrentes (inócuo no dado por idempotência,
# mas dobra chamadas à API). Se precisar escalar, trocar o scheduler por lock
# (advisory lock Postgres) ou cron dedicado ANTES de subir numReplicas.
numReplicas = 1
# ────────────────────────────────────────────────────────────────────────
# Sug 1 — Boot do Dia: gera sugestões de 3 prioridades
#   Segunda a sexta, 07:30 Bahia = 10:30 UTC
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "boot-do-dia"
schedule = "30 10 * * 1-5"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/boot-do-dia"

# ────────────────────────────────────────────────────────────────────────
# Sug 3 — Auto-encerramento pós-reunião: varre agenda a cada 15min
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "auto-encerrar"
schedule = "*/15 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/auto-encerrar"

# ────────────────────────────────────────────────────────────────────────
# Sug 4 — Triagem AI de e-mails: classifica inbox a cada 15min
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "triar-emails"
schedule = "*/15 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/triar-emails"

# ────────────────────────────────────────────────────────────────────────
# Sug 5 — Retrospectiva semanal: Domingo 20:00 Bahia = 23:00 UTC
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "retrospectiva-semanal"
schedule = "0 23 * * 0"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/retrospectiva-semanal"

# ────────────────────────────────────────────────────────────────────────
# DataCrazy polling — fallback se webhook falhar.
# Roda a cada 5 minutos. Idempotente via externalId.
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "datacrazy-poll"
schedule = "*/5 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/datacrazy-poll"

# ────────────────────────────────────────────────────────────────────────
# Google Calendar polling — sincroniza próxima e última reunião dos clientes
# a partir dos eventos do Google Calendar (match por e-mail do attendee).
# A cada 15min. Lookahead 60 dias / lookback 7 dias.
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "google-calendar-poll"
schedule = "*/15 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/google-calendar-poll"

# ────────────────────────────────────────────────────────────────────────
# Datacrazy Atividades polling — reuniões marcadas/realizadas registradas
# direto no CRM Datacrazy (separadas das mensagens de WhatsApp). A cada
# 30min porque atividades mudam menos frequentemente que mensagens.
# Lookahead 60 dias / lookback 30 dias.
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "datacrazy-atividades-poll"
schedule = "*/30 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/datacrazy-atividades-poll"

# ────────────────────────────────────────────────────────────────────────
# Status dos PRs vinculados às sugestões da Central de Implementações.
# A cada 30min, só leitura no GitHub, só os vínculos ainda "aberta" (máx. 50
# por rodada). Sem GITHUB_TOKEN configurado a rota responde 200 sem fazer
# nada — a sincronia é conveniência, não dependência de deploy.
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "implementacoes-pr-status"
schedule = "*/30 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/implementacoes-pr-status"

# ────────────────────────────────────────────────────────────────────────
# Anexos órfãos da Central de Implementações — objeto no B2 sem linha no banco.
# Dia 1 de cada mês, 06:00 Bahia = 09:00 UTC.
# MODO RELATÓRIO: sem ?apagar=1 a rota só CONTA e loga. A limpeza é chamada
# deliberada depois de ler o relatório — rotina que apaga arquivo sozinha, todo
# mês, sem ninguém olhar, é a forma mais cara de descobrir um bug.
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "implementacoes-anexos-orfaos"
schedule = "0 9 1 * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/implementacoes-anexos-orfaos"

# ────────────────────────────────────────────────────────────────────────
# Outlook ICS polling — reuniões marcadas no Outlook (calendário publicado).
# A cada 30min. Lookahead 60 dias / lookback 7 dias. Pré-requisito:
# OUTLOOK_ICS_URL configurada em Config (URL pública do .ics).
# ────────────────────────────────────────────────────────────────────────
[[crons]]
name = "outlook-poll"
schedule = "*/30 * * * *"
command = "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" $RAILWAY_PUBLIC_DOMAIN/api/cron/outlook-poll"
