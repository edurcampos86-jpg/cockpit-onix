name: Post-deploy smoke tests

# Smoke tests da produção. Roda em 3 situações:
#   1. Webhook do Railway pós-deploy (repository_dispatch event_type=deployed)
#   2. Cron a cada 15 min como fallback (mesmo sem deploy, monitora uptime)
#   3. Manualmente via workflow_dispatch (debug)
#
# Cada execução testa 3 endpoints da produção:
#   - GET /login              → 200 (sentinela do proxy/middleware)
#   - GET /api/health         → 200 + db:'up' (Postgres responde)
#   - GET /login              → 200 + contém "Acesse sua conta" (render OK)
#
# Em caso de falha:
#   - Posta no Slack (se SLACK_WEBHOOK_URL configurado)
#   - Cria GitHub Issue com label `incident` (auto-cria a label se não existir)
#
# Para configurar o webhook do Railway:
#   curl -X POST \
#     -H "Accept: application/vnd.github.everest-preview+json" \
#     -H "Authorization: token $GH_PAT" \
#     https://api.github.com/repos/edurcampos86-jpg/cockpit-onix/dispatches \
#     -d '{"event_type":"deployed"}'

on:
  repository_dispatch:
    types: [deployed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Evita runs paralelos pisando uns nos outros. Se o anterior demorar mais
  # que 15min (improvável), o próximo enfileira.
  group: post-deploy-smoke
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # pra abrir issue de incidente

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve base URL
        id: base
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::APP_BASE_URL não configurado (Settings → Variables)"
            exit 1
          fi
          # Remove trailing slashes pra evitar // nas URLs concatenadas
          while [ "${BASE_URL: -1}" = "/" ]; do BASE_URL="${BASE_URL%/}"; done
          echo "url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_URL"

      - name: Probe GET /login (root proxy check)
        id: root
        env:
          BASE: ${{ steps.base.outputs.url }}
        # Probe básico de roteamento. A raiz redireciona pra /login com 307
        # quando deslogado (qualquer smoke roda sem cookie), então testar GET /
        # esperando 200 dava falso positivo. Hitamos /login direto e validamos
        # 200 — o render do conteúdo é validado no step seguinte.
        run: |
          CODE=$(curl -sS -o /tmp/root.html -w "%{http_code}" --max-time 30 "$BASE/login")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "GET /login (root proxy) → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::GET /login retornou HTTP $CODE (esperado 200)"
            exit 1
          fi

      - name: Probe GET /api/health
        id: health
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BASE/api/health")
          BODY=$(head -c 1000 /tmp/health.json)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "GET /api/health → HTTP $CODE"
          echo "body: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/health retornou HTTP $CODE — body: $BODY"
            exit 1
          fi
          # Confirma que o ping ao Postgres deu up. Sem isso, app responde
          # 200 com DB down (cenário de degradação parcial) e a gente perde.
          DB=$(echo "$BODY" | jq -r '.db // "missing"')
          if [ "$DB" != "up" ]; then
            echo "::error::/api/health respondeu mas DB está '$DB' (esperado 'up')"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # Configuração do ambiente: quais feature flags estão ligadas.
      #
      # Step SEPARADO do health anônimo de propósito. O body daquele step vai
      # INTEIRO para dentro da issue de incidente; a lista de flags não pode ir
      # junto (ver o comentário em src/app/api/health/route.ts). Aqui o detalhe
      # fica só no summary do run, e a issue recebe apenas ok/drift.
      #
      # Só FALHA quando a variável EXPECTED_FLAGS_ON existe — é opt-in. Sem ela,
      # o step apenas registra o que encontrou, e o smoke segue verde.
      #   Settings → Variables → EXPECTED_FLAGS_ON
      #   valor: lista separada por vírgula, ex. "COCKPIT_REUNIAO,RBAC_ENFORCEMENT"
      #   valor: "none" para afirmar que NENHUMA flag deve estar ligada
      # Depois de definida, ligar uma flag em produção sem atualizar a variável
      # deixa o smoke vermelho — que é o ponto: mudança de configuração passa a
      # ter sinal.
      - name: Confirma flags do ambiente
        id: flags
        if: always() && steps.health.outputs.code == '200'
        env:
          BASE: ${{ steps.base.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ESPERADO: ${{ vars.EXPECTED_FLAGS_ON }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não configurado — pulando conferência de flags."
            echo "status=pulado" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE=$(curl -sS -o /tmp/health-auth.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/health")
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/health autenticado retornou HTTP $CODE"
            echo "status=erro" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # `flags` ausente = deploy anterior à mudança, ou CRON_SECRET do
          # Railway divergindo do secret do GitHub. Não falha: nesse caso o
          # próprio cron.yml já acusaria a divergência com 403.
          if ! jq -e 'has("flags")' /tmp/health-auth.json > /dev/null; then
            echo "::warning::/api/health não trouxe 'flags' — versão antiga no ar ou CRON_SECRET divergente."
            echo "status=indisponivel" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Qual versão respondeu. Sem isto o smoke provava que "alguma coisa"
          # estava no ar: um deploy que falhou em subir deixa a versão anterior
          # servindo, e todos os probes passam verdes contra código velho.
          SHA=$(jq -r '.versao.shaCurto // "?"' /tmp/health-auth.json)
          AMBIENTE=$(jq -r '.versao.ambiente // "?"' /tmp/health-auth.json)
          BRANCH=$(jq -r '.versao.branch // "?"' /tmp/health-auth.json)
          echo "versao=$SHA" >> "$GITHUB_OUTPUT"
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "No ar: $SHA ($BRANCH) em $AMBIENTE"

          ATUAL=$(jq -r '.flags | sort | join(",")' /tmp/health-auth.json)
          [ -n "$ATUAL" ] || ATUAL="none"
          echo "Flags ligadas: $ATUAL"
          {
            echo "### Ambiente"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit no ar | \`$SHA\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Environment | \`$AMBIENTE\` |"
            echo "| Flags ligadas | \`$ATUAL\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # AVISO, não erro. O commit no ar divergir de $GITHUB_SHA é normal
          # durante uma janela de deploy e no cron de 15min (main anda sem
          # deploy). Falhar aqui abriria issue de incidente a cada push — o
          # sinal viraria ruído, que é o que este workflow evita por desenho.
          if [ "$SHA" != "?" ] && [ "${GITHUB_SHA:0:7}" != "$SHA" ]; then
            echo "::warning::Commit no ar ($SHA) difere do commit deste run (${GITHUB_SHA:0:7}) — deploy em andamento, ou não subiu."
          fi

          if [ -z "$ESPERADO" ]; then
            echo "EXPECTED_FLAGS_ON não definida — só registrando, sem comparar."
            echo "status=registrado" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normaliza a variável do mesmo jeito que o lado do app: ordena e tira
          # espaço. Assim "b, a" e "a,b" são a mesma coisa.
          NORM=$(echo "$ESPERADO" | tr ',' '\n' | tr -d '[:space:]' | grep -v '^$' | sort | paste -sd, -)
          [ -n "$NORM" ] || NORM="none"
          if [ "$ATUAL" != "$NORM" ]; then
            echo "::error::Flags do ambiente divergem do esperado. Esperado: $NORM · Atual: $ATUAL"
            echo "status=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Configuração confere com EXPECTED_FLAGS_ON."
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Probe GET /login
        id: login
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          CODE=$(curl -sS -o /tmp/login.html -w "%{http_code}" --max-time 30 "$BASE/login")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "GET /login → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::GET /login retornou HTTP $CODE"
            exit 1
          fi
          if ! grep -q "Acesse sua conta" /tmp/login.html; then
            echo "::error::/login retornou 200 mas não contém 'Acesse sua conta' — render quebrado?"
            head -c 500 /tmp/login.html
            exit 1
          fi

      - name: Summary on success
        if: success()
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          {
            echo "## Smoke OK"
            echo ""
            echo "- \`GET /login\` ✅ (proxy)"
            echo "- \`GET /api/health\` ✅ (DB up)"
            echo "- no ar: \`${{ steps.flags.outputs.versao }}\` em \`${{ steps.flags.outputs.ambiente }}\`"
            echo "- flags do ambiente: ${{ steps.flags.outputs.status }}"
            echo "- \`GET /login\` ✅ (render OK)"
            echo ""
            echo "Base: $BASE"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────
      # Falhas: Slack + Issue
      # ─────────────────────────────────────────────────────────────────

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BASE: ${{ steps.base.outputs.url }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL não configurado — pulando."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # jq monta o JSON com escaping seguro
          PAYLOAD=$(jq -n \
            --arg base "$BASE" \
            --arg trigger "$TRIGGER" \
            --arg run "$RUN_URL" \
            '{
              text: ":rotating_light: Smoke test do Cockpit Onix falhou",
              blocks: [
                { type: "header", text: { type: "plain_text", text: ":rotating_light: Smoke FAIL — Cockpit Onix" } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: ("*App:*\n" + $base) },
                  { type: "mrkdwn", text: ("*Trigger:*\n" + $trigger) },
                  { type: "mrkdwn", text: ("*Run:*\n<" + $run + "|Ver detalhes>") }
                ]},
                { type: "context", elements: [
                  { type: "mrkdwn", text: "Veja `docs/DISASTER_RECOVERY.md` para procedimentos de rollback." }
                ]}
              ]
            }')
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Create incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.base.outputs.url }}
          TRIGGER: ${{ github.event_name }}
          ROOT_CODE: ${{ steps.root.outputs.code }}
          HEALTH_CODE: ${{ steps.health.outputs.code }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
          LOGIN_CODE: ${{ steps.login.outputs.code }}
          FLAGS_STATUS: ${{ steps.flags.outputs.status }}
          VERSAO: ${{ steps.flags.outputs.versao }}
          AMBIENTE: ${{ steps.flags.outputs.ambiente }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="🚨 Smoke FAIL — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Garante que a label existe (idempotente — silencia se já existir)
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels" \
            -d '{"name":"incident","color":"b60205","description":"Falha detectada por automação"}' \
            > /dev/null || true

          BODY=$(cat <<EOF
          ## Smoke test pós-deploy falhou

          - **Base:** $BASE
          - **Trigger:** $TRIGGER
          - **Run:** $RUN_URL
          - **No ar:** \`$VERSAO\` em \`$AMBIENTE\` (commit deste run: \`${GITHUB_SHA:0:7}\`)

          | Endpoint | HTTP | Esperado |
          |----------|------|----------|
          | \`GET /login\` (root proxy) | $ROOT_CODE | 200 |
          | \`GET /api/health\` | $HEALTH_CODE | 200 + db:up |
          | \`GET /login\` (render) | $LOGIN_CODE | 200 + "Acesse sua conta" |
          | Flags do ambiente | $FLAGS_STATUS | ok / registrado / pulado |

          ### /api/health body (truncado)

          \`\`\`json
          $HEALTH_BODY
          \`\`\`

          ### Próximos passos

          1. Abrir o Run no link acima e ver qual step falhou.
          2. Se DB down → checar Railway → Postgres service.
          3. Se app down → checar último deploy em Railway → Deployments.
          4. Se flags = \`drift\` → alguém mudou a config do ambiente. O Run
             mostra quais estão ligadas (a lista NÃO é publicada aqui de
             propósito); confira contra a variável \`EXPECTED_FLAGS_ON\`.
          5. Para rollback, ver \`docs/DISASTER_RECOVERY.md\` cenário 1.
          EOF
          )
          # Cria issue via API (gh CLI não está disponível no runner remoto)
          JSON=$(jq -n --arg title "$TITLE" --arg body "$BODY" \
            '{title: $title, body: $body, labels: ["incident"]}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$JSON" | jq -r '"Issue criada: " + .html_url'
