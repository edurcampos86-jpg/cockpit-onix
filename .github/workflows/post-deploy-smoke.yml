name: Post-deploy smoke tests

# Smoke tests da produção. Roda em 4 situações:
#   1. PUSH na main — o merge é o que dispara o deploy no Railway, então este é
#      o gatilho mais próximo do evento real que existe DENTRO do GitHub.
#      Espera a produção convergir antes de sondar (ver "Espera o deploy").
#   2. Webhook do Railway pós-deploy (repository_dispatch event_type=deployed)
#   3. Cron a cada 15 min como fallback (mesmo sem deploy, monitora uptime)
#   4. Manualmente via workflow_dispatch (debug)
#
# ── POR QUE O PUSH, E NÃO `workflow_run` DEPOIS DO CI ────────────────────────
# `ci.yml` dispara apenas em `pull_request` — não existe run de CI DEPOIS do
# merge para escutar. Amarrar em `workflow_run` ouviria o CI da PR, que termina
# ANTES do merge: sondaria produção antes de o deploy sequer começar.
# O `push` na main é o mesmo evento que o Railway escuta para deployar.
#
# O cron CONTINUA como rede de segurança. Este gatilho é adição, não troca:
# push cobre "acabei de mergear"; o cron cobre "está de pé desde ontem".
#
# Cada execução testa 4 endpoints da produção:
#   - GET /login                      → 200 (sentinela do proxy/middleware)
#   - GET /api/health                 → 200 + db:'up' (Postgres responde)
#   - GET /api/empresas/hierarquia    → 401/403 (gate fechado p/ anônimo) + controle
#   - GET /login                      → 200 + contém "Acesse sua conta" (render OK)
#
# Em caso de falha:
#   - Posta no Slack (se SLACK_WEBHOOK_URL configurado)
#   - Cria GitHub Issue com label `incident` (auto-cria a label se não existir)
#
# Para configurar o webhook do Railway:
#   curl -X POST \
#     -H "Accept: application/vnd.github.everest-preview+json" \
#     -H "Authorization: token $GH_PAT" \
#     https://api.github.com/repos/edurcampos86-jpg/cockpit-onix/dispatches \
#     -d '{"event_type":"deployed"}'

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deployed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Evita runs paralelos pisando uns nos outros. Se o anterior demorar mais
  # que 15min (improvável), o próximo enfileira.
  group: post-deploy-smoke
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # pra abrir issue de incidente

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 5 min bastavam quando o job só sondava (roda em ~10 s). A espera pelo
    # deploy, que só existe no gatilho de push, pode consumir até 13 min.
    # Teto, não atraso: os outros gatilhos seguem terminando em segundos.
    timeout-minutes: 20
    steps:
      - name: Resolve base URL
        id: base
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::APP_BASE_URL não configurado (Settings → Variables)"
            exit 1
          fi
          # Remove trailing slashes pra evitar // nas URLs concatenadas
          while [ "${BASE_URL: -1}" = "/" ]; do BASE_URL="${BASE_URL%/}"; done
          echo "url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_URL"

      # ─────────────────────────────────────────────────────────────────
      # Espera o deploy (SÓ no gatilho de push)
      #
      # O deploy é do Railway, não do Actions: quando o push chega aqui, o
      # Railway ainda está construindo. Sondar agora leria o commit ANTERIOR e
      # o smoke passaria verde contra código velho — exatamente a falha
      # silenciosa que o campo `versao` do /api/health existe para impedir.
      #
      # Então este step espera a produção CONVERGIR para o sha deste push antes
      # de qualquer probe.
      #
      # ── NUNCA REPROVA ─────────────────────────────────────────────────
      # Estourar a espera é `::warning::`, nunca `exit 1`. Quem decide se a
      # divergência é problema é o step "Divergência de sha", que só falha
      # depois de 30 min divergente — e continua sendo o único gate disso.
      # Um deploy legitimamente lento não pode virar CI vermelho.
      #
      # Sem CRON_SECRET não há como ler o sha no ar: o step se declara cego e
      # sai, e o run segue como sempre seguiu.
      - name: Espera o deploy convergir
        id: espera
        if: github.event_name == 'push'
        env:
          BASE: ${{ steps.base.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 60 s + 24 × 30 s ≈ 13 min. Um build de imagem completo tem levado
          # ~4 min; 13 dá folga para fila do Railway sem encostar no teto de
          # 30 min do gate de divergência.
          PRIMEIRA_ESPERA: '60'
          INTERVALO: '30'
          TENTATIVAS: '24'
        run: |
          set -uo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET ausente — sem como ler o sha no ar. Sondando sem esperar."
            echo "estado=cego" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ESPERADO="${GITHUB_SHA:0:7}"
          echo "Esperando produção convergir para \`$ESPERADO\`."

          sleep "$PRIMEIRA_ESPERA"

          i=0
          while [ "$i" -lt "$TENTATIVAS" ]; do
            i=$((i + 1))
            # `|| true`: falha de rede numa tentativa é ruído, não veredito.
            curl -sS -o /tmp/espera.json --max-time 20 \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/health" || true
            NO_AR=$(jq -r '.versao.shaCurto // empty' /tmp/espera.json 2>/dev/null || true)

            if [ "$NO_AR" = "$ESPERADO" ]; then
              MIN=$(( (PRIMEIRA_ESPERA + (i - 1) * INTERVALO) / 60 ))
              echo "Convergiu em ~${MIN} min: $ESPERADO está no ar."
              echo "estado=convergiu" >> "$GITHUB_OUTPUT"
              {
                echo "### Deploy conferido no push"
                echo ""
                echo "\`$ESPERADO\` no ar após ~${MIN} min."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep "$INTERVALO"
          done

          echo "::warning::Produção ainda em \`${NO_AR:-?}\` (esperado \`$ESPERADO\`) após a espera. Seguindo com os probes — quem decide se isso é falha é o gate de divergência, aos 30 min."
          echo "estado=estourou" >> "$GITHUB_OUTPUT"

      - name: Probe GET /login (root proxy check)
        id: root
        env:
          BASE: ${{ steps.base.outputs.url }}
        # Probe básico de roteamento. A raiz redireciona pra /login com 307
        # quando deslogado (qualquer smoke roda sem cookie), então testar GET /
        # esperando 200 dava falso positivo. Hitamos /login direto e validamos
        # 200 — o render do conteúdo é validado no step seguinte.
        run: |
          CODE=$(curl -sS -o /tmp/root.html -w "%{http_code}" --max-time 30 "$BASE/login")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "GET /login (root proxy) → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::GET /login retornou HTTP $CODE (esperado 200)"
            exit 1
          fi

      - name: Probe GET /api/health
        id: health
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BASE/api/health")
          BODY=$(head -c 1000 /tmp/health.json)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "GET /api/health → HTTP $CODE"
          echo "body: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/health retornou HTTP $CODE — body: $BODY"
            exit 1
          fi
          # Confirma que o ping ao Postgres deu up. Sem isso, app responde
          # 200 com DB down (cenário de degradação parcial) e a gente perde.
          DB=$(echo "$BODY" | jq -r '.db // "missing"')
          if [ "$DB" != "up" ]; then
            echo "::error::/api/health respondeu mas DB está '$DB' (esperado 'up')"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # Configuração do ambiente: quais feature flags estão ligadas.
      #
      # Step SEPARADO do health anônimo de propósito. O body daquele step vai
      # INTEIRO para dentro da issue de incidente; a lista de flags não pode ir
      # junto (ver o comentário em src/app/api/health/route.ts). Aqui o detalhe
      # fica só no summary do run, e a issue recebe apenas ok/drift.
      #
      # Só FALHA quando a variável EXPECTED_FLAGS_ON existe — é opt-in. Sem ela,
      # o step apenas registra o que encontrou, e o smoke segue verde.
      #   Settings → Variables → EXPECTED_FLAGS_ON
      #   valor: lista separada por vírgula, ex. "COCKPIT_REUNIAO,RBAC_ENFORCEMENT"
      #   valor: "none" para afirmar que NENHUMA flag deve estar ligada
      # Depois de definida, ligar uma flag em produção sem atualizar a variável
      # deixa o smoke vermelho — que é o ponto: mudança de configuração passa a
      # ter sinal.
      - name: Confirma flags do ambiente
        id: flags
        if: always() && steps.health.outputs.code == '200'
        env:
          BASE: ${{ steps.base.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ESPERADO: ${{ vars.EXPECTED_FLAGS_ON }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não configurado — pulando conferência de flags."
            echo "status=pulado" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE=$(curl -sS -o /tmp/health-auth.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/health")
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/health autenticado retornou HTTP $CODE"
            echo "status=erro" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # `flags` ausente = deploy anterior à mudança, ou CRON_SECRET do
          # Railway divergindo do secret do GitHub. Não falha: nesse caso o
          # próprio cron.yml já acusaria a divergência com 403.
          if ! jq -e 'has("flags")' /tmp/health-auth.json > /dev/null; then
            echo "::warning::/api/health não trouxe 'flags' — versão antiga no ar ou CRON_SECRET divergente."
            echo "status=indisponivel" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Qual versão respondeu. Sem isto o smoke provava que "alguma coisa"
          # estava no ar: um deploy que falhou em subir deixa a versão anterior
          # servindo, e todos os probes passam verdes contra código velho.
          SHA=$(jq -r '.versao.shaCurto // "?"' /tmp/health-auth.json)
          AMBIENTE=$(jq -r '.versao.ambiente // "?"' /tmp/health-auth.json)
          BRANCH=$(jq -r '.versao.branch // "?"' /tmp/health-auth.json)
          echo "versao=$SHA" >> "$GITHUB_OUTPUT"
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "No ar: $SHA ($BRANCH) em $AMBIENTE"

          ATUAL=$(jq -r '.flags | sort | join(",")' /tmp/health-auth.json)
          [ -n "$ATUAL" ] || ATUAL="none"
          echo "Flags ligadas: $ATUAL"
          {
            echo "### Ambiente"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit no ar | \`$SHA\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Environment | \`$AMBIENTE\` |"
            echo "| Flags ligadas | \`$ATUAL\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Valor que o dialeto da flag não reconhece ───────────────────
          #
          # FALHA SEMPRE, sem depender de EXPECTED_FLAGS_ON — e por isso vem
          # ANTES do bloco opt-in abaixo, que faz `exit 0` quando a variável
          # não está definida.
          #
          # A diferença é de natureza: "drift" é comparativo (a config mudou em
          # relação ao que alguém declarou), e mudar config é legítimo. Isto
          # aqui é errado sozinho, em qualquer ambiente: `sim` numa flag do
          # dialeto estrito deixa a flag DESLIGADA enquanto quem gravou acha
          # que ligou. Duas das chaves em jogo abrem escrita em `ClienteFato`,
          # que é ledger append-only — o custo de "achei que estava ligada" são
          # dias de fato não gravado, sem como voltar atrás.
          #
          # Ausente = deploy anterior a esta mudança. Avisa e segue, mesmo
          # critério de `flags` acima.
          if ! jq -e 'has("flagsValorInvalido")' /tmp/health-auth.json > /dev/null; then
            echo "::warning::/api/health não trouxe 'flagsValorInvalido' — versão antiga no ar."
          else
            INVALIDAS=$(jq -r '.flagsValorInvalido | join(",")' /tmp/health-auth.json)
            if [ -n "$INVALIDAS" ]; then
              echo "| Valor inválido | \`$INVALIDAS\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Flag com valor que o dialeto dela não reconhece: $INVALIDAS. Ela está valendo OFF, independente do que parece. Conserte em /configuracoes/flags (virar a chave grava 1/0) ou no Railway, se a origem for env."
              echo "status=valor-invalido" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          # AVISO, não erro. O commit no ar divergir de $GITHUB_SHA é normal
          # durante uma janela de deploy e no cron de 15min (main anda sem
          # deploy). Falhar aqui abriria issue de incidente a cada push — o
          # sinal viraria ruído, que é o que este workflow evita por desenho.
          if [ "$SHA" != "?" ] && [ "${GITHUB_SHA:0:7}" != "$SHA" ]; then
            echo "::warning::Commit no ar ($SHA) difere do commit deste run (${GITHUB_SHA:0:7}) — deploy em andamento, ou não subiu."
          fi

          if [ -z "$ESPERADO" ]; then
            echo "EXPECTED_FLAGS_ON não definida — só registrando, sem comparar."
            echo "status=registrado" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normaliza a variável do mesmo jeito que o lado do app: ordena e tira
          # espaço. Assim "b, a" e "a,b" são a mesma coisa.
          NORM=$(echo "$ESPERADO" | tr ',' '\n' | tr -d '[:space:]' | grep -v '^$' | sort | paste -sd, -)
          [ -n "$NORM" ] || NORM="none"
          if [ "$ATUAL" != "$NORM" ]; then
            echo "::error::Flags do ambiente divergem do esperado. Esperado: $NORM · Atual: $ATUAL"
            echo "status=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Configuração confere com EXPECTED_FLAGS_ON."
          echo "status=ok" >> "$GITHUB_OUTPUT"

      # ── ESTADO ENTRE EXECUÇÕES ─────────────────────────────────────────
      #
      # Restaurado ANTES dos steps que o leem (migrations e divergência). Chave
      # por `run_id` porque chave de cache é imutável; `restore-keys` traz a
      # mais recente.
      - name: Restaurar estado do ciclo anterior
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: /tmp/smoke-estado
          key: smoke-estado-${{ github.run_id }}
          restore-keys: smoke-estado-

      # ── MIGRATIONS PENDENTES — FALHA, E MEDE O ATRASO ──────────────────
      #
      # App no ar com schema velho. O probe de `/api/health` acima passa verde
      # nele — `SELECT 1` responde —, e o erro só aparece depois, como coluna
      # inexistente no meio de uma requisição de usuário. (Como a migration
      # roda hoje e por quê: bloco `[deploy]` do `railway.toml`.)
      #
      # FALHA, e não avisa: a lição da #301 é que informação sem gate depende de
      # alguém ler. Aqui não há ambiguidade a preservar — `pendentes` não vazio
      # significa que o código servindo tráfego espera colunas que o banco não
      # tem, e isso é errado em qualquer janela, inclusive durante um deploy.
      #
      # ── E MEDE HÁ QUANTO TEMPO ─────────────────────────────────────────
      # Saber que o schema está atrás não diz se são 5 minutos de janela de
      # deploy ou três dias como em agosto/2026. O post-mortem daquele caso só
      # foi possível comparando timestamps de runs à mão; aqui o número sai
      # pronto.
      #
      # PRECISÃO, sem fingir mais do que tem: o fim da janela vem de
      # `aplicadaEm` (o `finished_at` do próprio `_prisma_migrations`, exato); o
      # início vem da PRIMEIRA VEZ QUE O SMOKE VIU pendente, que chega até um
      # ciclo atrasado. O número é portanto um PISO — o atraso real é esse ou
      # maior, nunca menor.
      - name: Probe migrations aplicadas
        id: migrations
        if: always()
        run: |
          set -euo pipefail

          # Lido com grep/cut, não com `source`: o arquivo vem do cache, e
          # executá-lo seria dar poder de execução a um artefato de estado.
          ler() {
            [ -f /tmp/smoke-estado ] || return 0
            grep -m1 "^$1=" /tmp/smoke-estado 2>/dev/null | cut -d= -f2- || true
          }
          ANT_LISTA=$(ler MIG_ATRAS_LISTA)
          ANT_DESDE=$(ler MIG_ATRAS_DESDE)
          HIST=$(ler MIG_HISTORICO)
          AGORA=$(date +%s)

          # Quem grava o arquivo de estado é o step de divergência — um único
          # escritor, para dois steps não se sobrescreverem. Aqui só se decide
          # O QUE ele grava, e isso viaja por outputs.
          emitir() {
            {
              echo "atras_lista=${1:-}"
              echo "atras_desde=${2:-}"
              echo "historico=${3:-}"
            } >> "$GITHUB_OUTPUT"
          }

          # Ausente quando CRON_SECRET não está configurado: o step anterior sai
          # cedo sem escrever o arquivo. Nada a conferir, e não é falha deste —
          # mas a janela em curso é PRESERVADA (ciclo cego não é evidência de
          # que o schema alcançou).
          if [ ! -s /tmp/health-auth.json ]; then
            echo "Sem resposta autenticada — nada a conferir, janela preservada."
            emitir "$ANT_LISTA" "$ANT_DESDE" "$HIST"
            exit 0
          fi

          # Campo ausente = versão anterior à que passou a publicá-lo. Avisa e
          # segue, mesmo critério de `flags` e `flagsValorInvalido`.
          if ! jq -e 'has("migrations")' /tmp/health-auth.json > /dev/null; then
            echo "::warning::/api/health não trouxe 'migrations' — versão antiga no ar."
            emitir "$ANT_LISTA" "$ANT_DESDE" "$HIST"
            exit 0
          fi

          ULTIMA=$(jq -r '.migrations.ultima // "(nenhuma)"' /tmp/health-auth.json)
          APLICADA_EM=$(jq -r '.migrations.aplicadaEm // ""' /tmp/health-auth.json)
          APLICADAS=$(jq -r '.migrations.aplicadas' /tmp/health-auth.json)
          PENDENTES=$(jq -r '.migrations.pendentes | join(", ")' /tmp/health-auth.json)
          FALHAS=$(jq -r '.migrations.falhas | join(", ")' /tmp/health-auth.json)

          echo "Migrations aplicadas: $APLICADAS · última: $ULTIMA"
          {
            echo "| Migrations aplicadas | \`$APLICADAS\` |"
            echo "| Última migration | \`$ULTIMA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Separado de `pendentes` porque o conserto é outro: linha começada e
          # não terminada precisa de `migrate resolve` antes de qualquer nova
          # tentativa (ver Cenário 2 do DISASTER_RECOVERY).
          if [ -n "$FALHAS" ]; then
            emitir "$ANT_LISTA" "$ANT_DESDE" "$HIST"
            echo "| Migrations com falha | \`$FALHAS\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Migration começada e não concluída, ou revertida: $FALHAS. Rode 'prisma migrate resolve' antes de tentar de novo — ver Cenário 2 do docs/DISASTER_RECOVERY.md."
            exit 1
          fi

          if [ -n "$PENDENTES" ]; then
            # Conjunto igual ao do ciclo anterior = mesma janela, o relógio
            # continua. Conjunto diferente = migration nova entrou; a janela
            # recomeça, senão o deploy de hoje nasceria já vencido.
            if [ "$ANT_LISTA" = "$PENDENTES" ] && [ -n "$ANT_DESDE" ]; then
              DESDE="$ANT_DESDE"
            else
              DESDE="$AGORA"
            fi
            emitir "$PENDENTES" "$DESDE" "$HIST"
            MIN=$(( (AGORA - DESDE) / 60 ))
            {
              echo "| Migrations PENDENTES | \`$PENDENTES\` |"
              echo "| Schema atrás há | **${MIN} min** (piso — ver comentário no workflow) |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::App no ar com schema velho há ${MIN} min. O código servindo tráfego espera migrations que o banco não tem: $PENDENTES. Conserto: redeploy (o start aplica as migrations antes de subir — ver railway.toml) ou 'npm run db:migrate' com a DATABASE_URL de producao."
            exit 1
          fi

          # Estava atrás no ciclo anterior e alcançou agora: é a única hora em
          # que dá para FECHAR a medição, então é aqui que ela entra na série.
          NOVO_HIST="$HIST"
          if [ -n "$ANT_LISTA" ] && [ -n "$ANT_DESDE" ]; then
            FIM="$AGORA"
            if [ -n "$APLICADA_EM" ]; then
              FIM_DB=$(date -u -d "$APLICADA_EM" +%s 2>/dev/null || true)
              if [ -n "$FIM_DB" ] && [ "$FIM_DB" -gt "$ANT_DESDE" ]; then FIM="$FIM_DB"; fi
            fi
            ATRASO=$(( (FIM - ANT_DESDE) / 60 ))
            # Série curta de propósito: 8 entradas cabem no resumo sem virar
            # relatório, e o histórico longo de verdade são as issues.
            NOVO_HIST=$(printf '%s;%s:%s' "$HIST" "$ULTIMA" "$ATRASO" \
              | tr ';' '\n' | grep -v '^$' | tail -8 | paste -sd';' -)
            {
              echo "| ⏱️ Schema alcançou | \`$ULTIMA\` depois de **${ATRASO} min** atrás |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Schema alcançou o código: $ULTIMA aplicada após ${ATRASO} min de atraso (piso)."
          fi

          if [ -n "$NOVO_HIST" ]; then
            {
              echo ""
              echo "<details><summary>Série de atrasos de schema (últimos 8)</summary>"
              echo ""
              echo "| Migration | Atraso (min) |"
              echo "|---|---|"
              # <code> em vez de crase: crase dentro de aspas simples dispara
              # SC2016 no actionlint, e o `disable` não pega em heredoc de YAML.
              echo "$NOVO_HIST" | tr ';' '\n' | grep -v '^$' \
                | sed -E 's|^(.*):([0-9]+)$|<code>\1</code> \| \2|' \
                | sed -E 's|^|\| |; s|$| \||'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          emitir "" "" "$NOVO_HIST"
          echo "Schema em dia — nenhuma migration pendente."

      # ── DIVERGÊNCIA DE SHA — reporta, e falha depois de 30 MINUTOS ────
      #
      # Divergir é NORMAL durante a janela de build: o commit entrou na main e o
      # Railway ainda está construindo a imagem. O que não é normal é a
      # divergência que NÃO PASSA — deploy não promovido deixa a versão anterior
      # servindo indefinidamente, e o aviso repetido tem a mesma cara do aviso
      # de build.
      #
      # O limiar é em MINUTOS, e não em número de ciclos, porque a cadência do
      # `schedule` do GitHub não é a que o cron pede: o arquivo diz `*/15`, e a
      # entrega medida em 14 execuções seguidas ficou entre 46 e 94 minutos.
      # Contar ciclos faria o gate disparar entre 1,5 h e 3 h conforme a sorte
      # da fila. Contar tempo dá a mesma resposta em qualquer cadência.
      #
      # 30 minutos: com a cadência real, equivale a "falha na próxima
      # verificação se ainda estiver divergente", e é folgado para um build de
      # imagem Docker completo.
      #
      # O estado entre execuções vive no cache do Actions, restaurado lá em
      # cima. Este step é o ÚNICO que escreve o arquivo — o de migrations
      # manda o que quer gravar por output.
      - name: Divergência de sha e intervalo entre ciclos
        id: divergencia
        if: always()
        env:
          LIMIAR_MIN: '30'
          MIG_LISTA: ${{ steps.migrations.outputs.atras_lista }}
          MIG_DESDE: ${{ steps.migrations.outputs.atras_desde }}
          MIG_HIST: ${{ steps.migrations.outputs.historico }}
        run: |
          set -euo pipefail

          # Lido com grep/cut, não com `source`: o arquivo vem do cache, e
          # executá-lo seria dar poder de execução a um artefato de estado.
          ler() {
            [ -f /tmp/smoke-estado ] || return 0
            grep -m1 "^$1=" /tmp/smoke-estado 2>/dev/null | cut -d= -f2- || true
          }
          ANT_SMOKE=$(ler ULTIMO_SMOKE)
          ANT_ESPERADO=$(ler DIV_ESPERADO)
          ANT_NO_AR=$(ler DIV_NO_AR)
          ANT_DESDE=$(ler DIV_DESDE)

          AGORA=$(date +%s)

          # ── Intervalo desde o smoke anterior ─────────────────────────────
          # A lentidão do agendamento é invisível sem isto: só aparece
          # comparando timestamps de runs à mão. E ela muda o significado do
          # próprio gate abaixo, então pertence ao mesmo resumo.
          if [ -n "$ANT_SMOKE" ]; then
            INTERVALO=$(( (AGORA - ANT_SMOKE) / 60 ))
            echo "Intervalo desde o smoke anterior: ${INTERVALO} min"
            echo "| Intervalo desde o smoke anterior | \`${INTERVALO} min\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Primeiro ciclo com estado — sem intervalo para comparar."
          fi

          # ── ESCRITA DE ESTADO NÃO PODE REPROVAR O SMOKE ─────────────────
          #
          # Esta função já derrubou o workflow: era `[ -n "$1" ] && echo ...`, e
          # com `set -e` uma AND-list que devolve 1 (argumento vazio → `[` falha
          # → a lista inteira devolve 1) mata o step. O caminho "Convergiu"
          # chama com os três argumentos VAZIOS, ou seja, o caminho FELIZ era o
          # que reprovava. Entre 15/08 08:35 e 13:07 isso abriu 11 issues de
          # incidente com a produção 100% saudável.
          #
          # Duas travas contra a repetição: `if` em vez de AND-list (um `if`
          # com condição falsa devolve 0), e `|| warning` na chamada — anotar
          # o ciclo é escrituração, não é probe, e escrituração que falha vira
          # aviso, nunca alarme.
          escrever_estado() {
            {
              echo "ULTIMO_SMOKE=$AGORA"
              if [ -n "${1:-}" ]; then echo "DIV_ESPERADO=$1"; fi
              if [ -n "${2:-}" ]; then echo "DIV_NO_AR=$2"; fi
              if [ -n "${3:-}" ]; then echo "DIV_DESDE=$3"; fi
              if [ -n "${MIG_LISTA:-}" ]; then echo "MIG_ATRAS_LISTA=$MIG_LISTA"; fi
              if [ -n "${MIG_DESDE:-}" ]; then echo "MIG_ATRAS_DESDE=$MIG_DESDE"; fi
              if [ -n "${MIG_HIST:-}" ]; then echo "MIG_HISTORICO=$MIG_HIST"; fi
            } > /tmp/smoke-estado
          }
          gravar() {
            escrever_estado "$@" || echo "::warning::Não consegui gravar o estado do ciclo — a próxima execução recomeça a contagem."
          }

          # Ciclo cego (sem CRON_SECRET, ou resposta sem `versao`): NÃO é
          # evidência de convergência. A janela de divergência é preservada —
          # só o relógio do intervalo avança.
          if [ ! -s /tmp/health-auth.json ] || ! jq -e '.versao.shaCurto' /tmp/health-auth.json > /dev/null 2>&1; then
            echo "Sem sha no ar para comparar — janela preservada."
            gravar "$ANT_ESPERADO" "$ANT_NO_AR" "$ANT_DESDE"
            exit 0
          fi

          NO_AR=$(jq -r '.versao.shaCurto' /tmp/health-auth.json)
          ESPERADO="${GITHUB_SHA:0:7}"

          if [ "$NO_AR" = "$ESPERADO" ]; then
            echo "Convergiu: $NO_AR está no ar."
            gravar "" "" ""
            exit 0
          fi

          # Par diferente do anterior = deploy NOVO em voo. A janela recomeça:
          # herdar o relógio de uma divergência antiga faria o build seguinte
          # nascer já vencido.
          if [ "$ANT_ESPERADO" = "$ESPERADO" ] && [ "$ANT_NO_AR" = "$NO_AR" ] && [ -n "$ANT_DESDE" ]; then
            DESDE="$ANT_DESDE"
          else
            DESDE="$AGORA"
          fi

          # Grava ANTES de decidir: se este ciclo falhar, o próximo tem de
          # continuar vendo a mesma janela, não recomeçar a contagem.
          gravar "$ESPERADO" "$NO_AR" "$DESDE"

          MIN=$(( (AGORA - DESDE) / 60 ))
          echo "Divergente há ${MIN} min (limiar: ${LIMIAR_MIN} min)."

          if [ "$MIN" -ge "$LIMIAR_MIN" ]; then
            {
              echo ""
              echo "### 🛑 Deploy não entrou"
              echo ""
              echo "No ar: \`$NO_AR\` · esperado: \`$ESPERADO\` · divergente há **${MIN} min**."
              echo ""
              echo "Passou de ${LIMIAR_MIN} min, então não é janela de build."
              echo "Railway → Deployments: procure o deploy vermelho e leia os **Deploy Logs**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Commit no ar ($NO_AR) difere do esperado ($ESPERADO) há ${MIN} min, acima do limiar de ${LIMIAR_MIN} min. Não é build — é deploy que não foi promovido."
            exit 1
          fi

          echo "::warning::Commit no ar ($NO_AR) difere do esperado ($ESPERADO) há ${MIN} min. Dentro do limiar de ${LIMIAR_MIN} min — provavelmente build em andamento."

      - name: Guardar estado para o próximo ciclo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/smoke-estado
          key: smoke-estado-${{ github.run_id }}

      # ─────────────────────────────────────────────────────────────────
      # `/api/empresas/hierarquia` está gateada?
      #
      # POR QUE SEM SESSÃO: a rota é admin-only (`isAdmin(ctx)` → 403). Um
      # probe autenticado exigiria guardar credencial de admin em secret e
      # renová-la quando expirasse — custo alto e um segredo a mais para
      # vazar, por uma pergunta que não precisa dele.
      #
      # ── O QUE ESTE PROBE PROVA, E O QUE NÃO PROVA ──────────────────────
      # Sem sessão a requisição NÃO chega ao handler: `src/proxy.ts` responde
      # 401 antes, porque o path não está em `ehRotaPublica()`. Ou seja, o 401
      # vem da camada de autenticação, não da rota — e um caminho inexistente
      # sob /api/ devolve exatamente o mesmo 401.
      #
      # Então este probe NÃO prova que a rota subiu no build. Quem responde
      # isso é o `versao.shaCurto` do /api/health autenticado, logo acima.
      #
      # O que ele prova, e hoje ninguém prova:
      #   - o gate está FECHADO para anônimo (200 seria incidente de acesso)
      #   - o proxy segue interceptando /api/* (o controle abaixo)
      #   - a app responde nesse path em vez de 5xx
      #
      # ── O CONTROLE ────────────────────────────────────────────────────
      # Um caminho irmão que garantidamente não existe tem de devolver o MESMO
      # código. Divergência é sinal:
      #   ambos 404  → o proxy parou de interceptar /api/*: TODA rota de API
      #                está sem o gate de sessão. É o pior desfecho possível,
      #                e nenhum probe atual o detectaria.
      #   real 200   → gate de admin aberto para anônimo.
      - name: Probe GET /api/empresas/hierarquia (admin-only, sem sessão)
        id: hierarquia
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          CODE=$(curl -sS -o /tmp/hierarquia.json -w "%{http_code}" --max-time 30 \
            "$BASE/api/empresas/hierarquia")
          CONTROLE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "$BASE/api/empresas/__probe-inexistente__")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "controle=$CONTROLE" >> "$GITHUB_OUTPUT"
          echo "GET /api/empresas/hierarquia (anônimo) → HTTP $CODE"
          echo "GET /api/empresas/__probe-inexistente__ (controle) → HTTP $CONTROLE"

          case "$CODE" in
            401|403)
              echo "Gate fechado para anônimo — é o esperado."
              ;;
            200)
              echo "::error::/api/empresas/hierarquia respondeu 200 SEM SESSÃO. Rota admin-only respondendo a anônimo é INCIDENTE DE ACESSO, não de disponibilidade. Confira src/proxy.ts e isAdmin() em src/app/api/empresas/hierarquia/route.ts."
              head -c 500 /tmp/hierarquia.json
              exit 1
              ;;
            *)
              echo "::error::/api/empresas/hierarquia retornou HTTP $CODE (esperado 401 ou 403). Body abaixo."
              head -c 500 /tmp/hierarquia.json
              exit 1
              ;;
          esac

          # O controle é o que dá sentido ao 401 acima. Se um caminho
          # inexistente responde 404 enquanto o real responde 401, o proxy
          # deixou de interceptar /api/* — e nesse caso o 401 do real veio de
          # outro lugar, ou vai sumir no próximo deploy.
          if [ "$CONTROLE" != "$CODE" ]; then
            echo "::error::Controle divergiu: /api/empresas/hierarquia → $CODE, caminho inexistente → $CONTROLE. Sem sessão os dois têm de responder igual (o proxy gateia ANTES de rotear). Divergência significa que src/proxy.ts parou de cobrir /api/* — todas as rotas de API ficam sem gate de sessão."
            exit 1
          fi

      - name: Probe GET /login
        id: login
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          CODE=$(curl -sS -o /tmp/login.html -w "%{http_code}" --max-time 30 "$BASE/login")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "GET /login → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::GET /login retornou HTTP $CODE"
            exit 1
          fi
          if ! grep -q "Acesse sua conta" /tmp/login.html; then
            echo "::error::/login retornou 200 mas não contém 'Acesse sua conta' — render quebrado?"
            head -c 500 /tmp/login.html
            exit 1
          fi

      - name: Summary on success
        if: success()
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          {
            echo "## Smoke OK"
            echo ""
            echo "- \`GET /login\` ✅ (proxy)"
            echo "- \`GET /api/health\` ✅ (DB up)"
            echo "- no ar: \`${{ steps.flags.outputs.versao }}\` em \`${{ steps.flags.outputs.ambiente }}\`"
            echo "- flags do ambiente: ${{ steps.flags.outputs.status }}"
            echo "- \`GET /api/empresas/hierarquia\` ✅ (HTTP ${{ steps.hierarquia.outputs.code }}, controle ${{ steps.hierarquia.outputs.controle }} — gate de sessão cobrindo /api/*)"
            echo "- \`GET /login\` ✅ (render OK)"
            echo ""
            echo "Base: $BASE"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────
      # Falhas: Slack + Issue
      # ─────────────────────────────────────────────────────────────────

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BASE: ${{ steps.base.outputs.url }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL não configurado — pulando."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # jq monta o JSON com escaping seguro
          PAYLOAD=$(jq -n \
            --arg base "$BASE" \
            --arg trigger "$TRIGGER" \
            --arg run "$RUN_URL" \
            '{
              text: ":rotating_light: Smoke test do Cockpit Onix falhou",
              blocks: [
                { type: "header", text: { type: "plain_text", text: ":rotating_light: Smoke FAIL — Cockpit Onix" } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: ("*App:*\n" + $base) },
                  { type: "mrkdwn", text: ("*Trigger:*\n" + $trigger) },
                  { type: "mrkdwn", text: ("*Run:*\n<" + $run + "|Ver detalhes>") }
                ]},
                { type: "context", elements: [
                  { type: "mrkdwn", text: "Veja `docs/DISASTER_RECOVERY.md` para procedimentos de rollback." }
                ]}
              ]
            }')
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Create incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.base.outputs.url }}
          TRIGGER: ${{ github.event_name }}
          ROOT_CODE: ${{ steps.root.outputs.code }}
          HEALTH_CODE: ${{ steps.health.outputs.code }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
          HIERARQUIA_CODE: ${{ steps.hierarquia.outputs.code }}
          HIERARQUIA_CONTROLE: ${{ steps.hierarquia.outputs.controle }}
          LOGIN_CODE: ${{ steps.login.outputs.code }}
          FLAGS_STATUS: ${{ steps.flags.outputs.status }}
          VERSAO: ${{ steps.flags.outputs.versao }}
          AMBIENTE: ${{ steps.flags.outputs.ambiente }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="🚨 Smoke FAIL — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Garante que a label existe (idempotente — silencia se já existir)
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels" \
            -d '{"name":"incident","color":"b60205","description":"Falha detectada por automação"}' \
            > /dev/null || true

          BODY=$(cat <<EOF
          ## Smoke test pós-deploy falhou

          - **Base:** $BASE
          - **Trigger:** $TRIGGER
          - **Run:** $RUN_URL
          - **No ar:** \`$VERSAO\` em \`$AMBIENTE\` (commit deste run: \`${GITHUB_SHA:0:7}\`)

          | Endpoint | HTTP | Esperado |
          |----------|------|----------|
          | \`GET /login\` (root proxy) | $ROOT_CODE | 200 |
          | \`GET /api/health\` | $HEALTH_CODE | 200 + db:up |
          | \`GET /api/empresas/hierarquia\` | $HIERARQUIA_CODE | 401 ou 403 (gate p/ anônimo) |
          | controle (caminho inexistente) | $HIERARQUIA_CONTROLE | igual ao de cima |
          | \`GET /login\` (render) | $LOGIN_CODE | 200 + "Acesse sua conta" |
          | Flags do ambiente | $FLAGS_STATUS | ok / registrado / pulado |
          | Valores de flag | ver step | nenhum \`valor-invalido\` |

          ### /api/health body (truncado)

          \`\`\`json
          $HEALTH_BODY
          \`\`\`

          ### Próximos passos

          1. Abrir o Run no link acima e ver qual step falhou.
          2. Se DB down → checar Railway → Postgres service.
          3. Se app down → checar último deploy em Railway → Deployments.
          4. Se flags = \`drift\` → alguém mudou a config do ambiente. O Run
             mostra quais estão ligadas (a lista NÃO é publicada aqui de
             propósito); confira contra a variável \`EXPECTED_FLAGS_ON\`.
          5. Se flags = \`valor-invalido\` → alguém gravou numa flag um valor
             que o dialeto DELA não aceita (o caso típico é \`sim\` numa das 4
             estritas). A flag está valendo OFF, independente do que parece.
             O Run nomeia quais; conserte virando a chave em
             \`/configuracoes/flags\` (a tela grava \`1\`/\`0\`, aceitos pelos
             dois dialetos) ou no Railway, se a origem for env. Isto reprova
             SEMPRE — não depende de \`EXPECTED_FLAGS_ON\`.
          6. Se \`/api/empresas/hierarquia\` = **200** sem sessão → gate aberto
             para anônimo. É incidente de ACESSO, não de disponibilidade:
             trate primeiro, antes de qualquer rollback.
          7. Se o **controle divergiu** do real → \`src/proxy.ts\` deixou de
             interceptar \`/api/*\`, e nesse caso TODA rota de API está sem
             gate de sessão. Mesma prioridade do item 6.
          8. Para rollback, ver \`docs/DISASTER_RECOVERY.md\` cenário 1.
          EOF
          )
          # Cria issue via API (gh CLI não está disponível no runner remoto)
          JSON=$(jq -n --arg title "$TITLE" --arg body "$BODY" \
            '{title: $title, body: $body, labels: ["incident"]}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$JSON" | jq -r '"Issue criada: " + .html_url'
