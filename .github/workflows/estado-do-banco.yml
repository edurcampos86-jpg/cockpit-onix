name: estado-do-banco

# Lê o estado do banco de PRODUÇÃO e escreve o resultado no resumo do job, para
# quem revisa uma PR de migration ver o banco REAL ao lado do diff.
#
# ── POR QUE ISTO EXISTE ──────────────────────────────────────────────────
# A PR #301 foi escrita inteira sobre a premissa "a tabela `Empresa` está
# vazia em produção". A tabela tem 6 linhas. A migration dela teria falhado com
# 23502 no meio do `migrate deploy` — e, com o `startCommand` de então, isso
# não pararia a migration: pararia o serviço.
#
# A premissa não era mentira, era uma coisa que ninguém tinha como conferir: a
# rede das sessões de agente é bloqueada para produção (`CONNECT 403`), e
# conferir à mão depende de alguém lembrar. Este workflow tira a conferência do
# "alguém lembra" e a coloca no lugar onde a decisão é tomada — a própria PR.
#
# ── SOMENTE LEITURA ──────────────────────────────────────────────────────
# `migrate status` (que não aplica nada), consultas agregadas e um script
# read-only. Nenhum INSERT/UPDATE/DELETE/DDL. Nenhuma consulta devolve linha de
# cliente.
#
# ── SOBRE O SECRET NUMA PR ───────────────────────────────────────────────
# O gatilho é `pull_request`, NUNCA `pull_request_target`. A diferença é de
# segurança, não de estilo: `pull_request` roda o workflow da branch da PR SEM
# segredos quando a PR vem de um fork, e o repositório é público. O `if` do job
# torna isso explícito em vez de depender só desse comportamento — PR de fora
# do repositório nem começa, em vez de começar e falhar no guard com o secret
# vazio.

on:
  workflow_dispatch:
    inputs:
      consultas:
        description: 'basico = migrations + Empresa · completo = inclui BtgSyncLog e fontes do backoffice'
        type: choice
        options:
          - basico
          - completo
        default: basico
  pull_request:
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'

permissions:
  contents: read

concurrency:
  group: estado-do-banco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ler:
    name: Estado do banco de produção
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR de fork não tem secret — e não deve ter. Melhor não rodar do que rodar
    # e falhar com uma mensagem que parece problema de configuração.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Conferir que o secret existe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::secrets.DATABASE_URL não está configurado neste repositório."
            exit 1
          fi
          echo "secrets.DATABASE_URL presente."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # A pergunta que mais importa numa PR de migration: o que ainda não foi
      # aplicado? `migrate status` sai com código != 0 quando há migration
      # pendente, o que é o estado NORMAL de uma PR que acrescenta uma — por
      # isso o código é capturado, e não deixado derrubar o job.
      - name: Migrations pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          set +e
          npx prisma migrate status > "${RUNNER_TEMP}/status.txt" 2>&1
          set -e
          {
            echo '## Migrations'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/status.txt"

      # `Empresa` tem tratamento próprio porque é a tabela cuja pré-condição já
      # foi lida errada uma vez. O script sai 0 (vazia), 1 (tem linhas) ou 2
      # (não sei dizer) — os três são RESULTADO, não falha do workflow.
      - name: Estado de "Empresa"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # shellcheck disable=SC2016
          # As crases nas mensagens abaixo são markdown do resumo do job, não
          # command substitution — aspas simples é exatamente o que se quer.
          set -euo pipefail
          set +e
          npx tsx scripts/verificar-empresa-vazia.ts > "${RUNNER_TEMP}/empresa.txt" 2>&1
          CODIGO=$?
          set -e
          case "$CODIGO" in
            0) VEREDITO='**VAZIA** — migration que exija tabela vazia pode ser aplicada.' ;;
            1) VEREDITO='**TEM LINHAS** — toda migration sobre `Empresa` precisa tratar o dado existente.' ;;
            *) VEREDITO='**INDETERMINADO** — não consegui perguntar ao banco. Isto não é "está limpo".' ;;
          esac
          {
            echo
            echo '## Tabela `Empresa`'
            echo
            echo "$VEREDITO"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/empresa.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/empresa.txt"
          echo "código: $CODIGO"

      # Só no disparo manual com `completo`. São as consultas da auditoria BTG:
      # úteis de vez em quando, ruído em toda PR de migration.
      - name: Consultas de auditoria (BtgSyncLog e fontes)
        if: github.event_name == 'workflow_dispatch' && inputs.consultas == 'completo'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/auditoria.sql" <<'SQL'
          SELECT '=== BtgSyncLog: webhook ===' AS secao;
          SELECT
            count(*)                                  AS total,
            min(iniciado)                             AS primeiro,
            max(iniciado)                             AS ultimo,
            count(*) FILTER (WHERE sucesso)           AS com_sucesso
          FROM "BtgSyncLog"
          WHERE tipo = 'webhook';

          SELECT '=== BtgSyncLog: todos os tipos ===' AS secao;
          SELECT tipo, count(*) AS linhas, max(iniciado) AS ultimo
          FROM "BtgSyncLog" GROUP BY tipo ORDER BY count(*) DESC;

          SELECT '=== Volume do backoffice ===' AS secao;
          SELECT
            (SELECT count(*) FROM "ClienteBackoffice")                         AS clientes,
            (SELECT count(*) FROM "ClienteBackoffice" WHERE "saldoConta" <> 0) AS com_saldo_cc,
            (SELECT count(*) FROM "MovimentacaoBtg")                           AS movimentacoes;

          -- `upsert-cliente.ts` grava `{campo: "fonte:timestamp"}`. Desmontar isso
          -- diz QUEM escreve hoje — a planilha ou a Partner API. Lê a etiqueta de
          -- origem, nunca o valor do campo.
          SELECT '=== Qual fonte escreveu, e quando ===' AS secao;
          SELECT
            split_part(e.value, ':', 1)                               AS fonte,
            count(*)                                                  AS campos_gravados,
            count(DISTINCT c.id)                                      AS clientes,
            max(substring(e.value from position(':' in e.value) + 1)) AS mais_recente
          FROM "ClienteBackoffice" c,
               LATERAL jsonb_each_text(c."fonteUltimoUpdate") AS e(key, value)
          WHERE c."fonteUltimoUpdate" IS NOT NULL
          GROUP BY 1
          ORDER BY 2 DESC;
          SQL

          # postgres:16-alpine pelo mesmo motivo do db-backup.yml: casar a versão
          # do cliente com o Postgres 16 do Railway.
          docker run --rm \
            -v "${RUNNER_TEMP}/auditoria.sql:/q.sql:ro" \
            -e "PGURL=${DATABASE_URL}" \
            postgres:16-alpine \
            sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc -f /q.sql' \
            | tee "${RUNNER_TEMP}/auditoria.txt"

          {
            echo
            echo '## Auditoria'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/auditoria.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
