name: CI

# Gates de código em toda PR.
#
# Antes disto, NENHUM workflow rodava test, lint ou build. Os 5 arquivos de
# teste do repo (27 casos) nunca tinham sido executados em CI — só rodavam se
# alguém digitasse `npm test` na mão — e uma PR podia quebrar o build sem nada
# acusar até o deploy no Railway.
#
# docker-build-check.yml também constrói a app, mas tem path filter
# (Dockerfile/.dockerignore/railway.toml), então não cobre PR de código.
#
# Sem path filter aqui, de propósito: roda sempre, o que permite torná-lo
# required check sem o deadlock de "check expected que nunca roda" — mesma
# razão documentada em actionlint.yml.
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Build da app leva ~4min; o resto é segundos. 20 dá folga para fila e
    # cache frio de npm.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # O gate de lint compara a PR com seu merge-base — precisa do
          # histórico, que o checkout raso (default depth=1) não traz.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Mesma major do runtime de produção (Dockerfile: node:22-bookworm-slim).
          node-version: '22'
          cache: npm

      - name: Install
        id: install
        # postinstall roda `prisma generate`, que cria src/generated/ (não
        # versionado). Build e lint dependem disso.
        run: npm ci

      # Os três gates abaixo rodam mesmo se um anterior falhar, para a PR
      # mostrar tudo que está quebrado num run só em vez de um problema por
      # vez. Todos exigem o install ter dado certo — sem node_modules os três
      # falhariam por um motivo que não é o deles.

      - name: Test
        if: always() && steps.install.outcome == 'success'
        run: npm test

      - name: Lint (apenas arquivos alterados)
        if: always() && steps.install.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `npm run lint` no repo inteiro hoje falha com 35 erros
          # PRÉ-EXISTENTES (26 @typescript-eslint/no-explicit-any + 9
          # react-hooks, em 13 arquivos). Ligar o lint global como gate
          # deixaria toda PR vermelha por dívida que ela não criou, e o sinal
          # viraria ruído em uma semana.
          #
          # Então o gate é sobre o que a PR TOCA: código novo entra limpo, e a
          # dívida antiga se paga sozinha conforme os arquivos forem mexidos.
          # Zerar os 35 é backlog próprio, não trabalho de PR cirúrgica.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          # --diff-filter=d exclui arquivo deletado: lintar caminho que não
          # existe mais aborta o eslint.
          FILES=$(git diff --name-only --diff-filter=d "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "Nenhum .ts/.tsx alterado nesta PR — nada a lintar."
            exit 0
          fi
          echo "Arquivos alterados nesta PR:"
          echo "$FILES" | awk '{ print "  " $0 }'
          echo "---"
          echo "$FILES" | xargs npx eslint

      - name: Build
        if: always() && steps.install.outcome == 'success'
        # O heap padrão do Node não basta para o build desta app.
        run: NODE_OPTIONS=--max-old-space-size=8192 npm run build

      # Guarda do drift do índice full-text de PainelEmailAI.
      #
      # A coluna gerada `tsv` vive em SQL bruto (20260519240000) e o schema a
      # declara como Unsupported("tsvector"), então TODA rodada de
      # `prisma migrate dev` injeta dois statements que ninguém pediu:
      #
      #     DROP INDEX "PainelEmailAI_tsv_idx";
      #     ALTER TABLE "PainelEmailAI" ALTER COLUMN "tsv" DROP DEFAULT;
      #
      # Isso não é hipótese: o índice JÁ sumiu de produção uma vez e precisou
      # de migration própria para voltar (20260613120000_painel_email_fts_index_recreate,
      # que documenta "Reconciliacao read-only de 13/06/2026 confirmou: coluna
      # tsv presente, indice ausente"). Vinte migrations carregam a nota de que
      # a remoção foi feita à mão — o aviso mora em cabeçalho de migration, que
      # só se lê depois do estrago.
      #
      # Este passo não depende do install: é grep puro sobre arquivos versionados,
      # então roda mesmo se o `npm ci` falhar.
      - name: Guarda do índice FTS (PainelEmailAI)
        if: always()
        run: |
          # Linha iniciada por `--` é comentário SQL e é IGNORADA de propósito:
          # as migrations documentam a remoção em comentário e precisam passar.
          # O que reprova é o statement executável.
          #
          # shellcheck disable=SC2016
          # ^ O bloco entre aspas simples é um programa AWK, não shell: `$0` ali
          #   é "a linha atual" para o awk. Expandir como variável de shell é
          #   justamente o que NÃO se quer.
          OFENSORES=$(find prisma/migrations -name '*.sql' -print0 \
            | xargs -0 --no-run-if-empty awk '
                /^[[:space:]]*--/ { next }
                /DROP[[:space:]]+INDEX[^;]*PainelEmailAI_tsv_idx/ {
                  print FILENAME ":" FNR ": " $0
                }
                /ALTER[[:space:]]+COLUMN[[:space:]]+"?tsv"?[[:space:]]+DROP[[:space:]]+DEFAULT/ {
                  print FILENAME ":" FNR ": " $0
                }
              ')

          if [ -n "$OFENSORES" ]; then
            echo "::error::Migration derruba o índice full-text de PainelEmailAI."
            echo ""
            echo "Statements executáveis encontrados:"
            echo "$OFENSORES"
            echo ""
            echo "O QUE FAZER: apague essas linhas do migration.sql à mão."
            echo "Elas são DRIFT — o \`prisma migrate dev\` as injeta sozinho porque"
            echo "a coluna gerada \`tsv\` vive em SQL bruto (20260519240000) e o"
            echo "schema a declara como Unsupported(\"tsvector\"). Não pertencem à"
            echo "sua mudança, e o DROP INDEX destrói o índice FTS de PRODUÇÃO —"
            echo "já aconteceu uma vez (ver 20260613120000_painel_email_fts_index_recreate)."
            echo ""
            echo "Deixe a explicação em COMENTÁRIO (linha começando com --), como"
            echo "fazem as migrations existentes: comentário passa nesta guarda."
            exit 1
          fi

          echo "OK: nenhum DROP executável do índice FTS em prisma/migrations/."
