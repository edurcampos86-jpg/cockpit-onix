name: CI

# Gates de código em toda PR.
#
# Antes disto, NENHUM workflow rodava test, lint ou build. Os 5 arquivos de
# teste do repo (27 casos) nunca tinham sido executados em CI — só rodavam se
# alguém digitasse `npm test` na mão — e uma PR podia quebrar o build sem nada
# acusar até o deploy no Railway.
#
# docker-build-check.yml também constrói a app, mas tem path filter
# (Dockerfile/.dockerignore/railway.toml), então não cobre PR de código.
#
# Sem path filter aqui, de propósito: roda sempre, o que permite torná-lo
# required check sem o deadlock de "check expected que nunca roda" — mesma
# razão documentada em actionlint.yml.
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Build da app leva ~4min; o resto é segundos. 20 dá folga para fila e
    # cache frio de npm.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # O gate de lint compara a PR com seu merge-base — precisa do
          # histórico, que o checkout raso (default depth=1) não traz.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Mesma major do runtime de produção (Dockerfile: node:22-bookworm-slim).
          node-version: '22'
          cache: npm

      - name: Install
        id: install
        # postinstall roda `prisma generate`, que cria src/generated/ (não
        # versionado). Build e lint dependem disso.
        run: npm ci

      # Os três gates abaixo rodam mesmo se um anterior falhar, para a PR
      # mostrar tudo que está quebrado num run só em vez de um problema por
      # vez. Todos exigem o install ter dado certo — sem node_modules os três
      # falhariam por um motivo que não é o deles.

      - name: Test
        if: always() && steps.install.outcome == 'success'
        run: npm test

      - name: Lint (apenas arquivos alterados)
        if: always() && steps.install.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `npm run lint` no repo inteiro hoje falha com 35 erros
          # PRÉ-EXISTENTES (26 @typescript-eslint/no-explicit-any + 9
          # react-hooks, em 13 arquivos). Ligar o lint global como gate
          # deixaria toda PR vermelha por dívida que ela não criou, e o sinal
          # viraria ruído em uma semana.
          #
          # Então o gate é sobre o que a PR TOCA: código novo entra limpo, e a
          # dívida antiga se paga sozinha conforme os arquivos forem mexidos.
          # Zerar os 35 é backlog próprio, não trabalho de PR cirúrgica.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          # --diff-filter=d exclui arquivo deletado: lintar caminho que não
          # existe mais aborta o eslint.
          FILES=$(git diff --name-only --diff-filter=d "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "Nenhum .ts/.tsx alterado nesta PR — nada a lintar."
            exit 0
          fi
          echo "Arquivos alterados nesta PR:"
          echo "$FILES" | awk '{ print "  " $0 }'
          echo "---"
          echo "$FILES" | xargs npx eslint

      - name: Build
        if: always() && steps.install.outcome == 'success'
        # O heap padrão do Node não basta para o build desta app.
        run: NODE_OPTIONS=--max-old-space-size=8192 npm run build

      # Guarda do drift do índice full-text de PainelEmailAI.
      #
      # A regra vive em scripts/guarda-drift-fts.sh, que documenta o porquê e
      # tem teste próprio (src/lib/guarda-drift-fts.test.ts). Antes ela era
      # shell inline aqui, onde NADA a exercitava: um reformat do AWK que
      # parasse de casar deixaria o passo verde e a proteção sumiria em
      # silêncio.
      #
      # Segue sem depender do install: é find + awk, então roda mesmo se o
      # `npm ci` falhar.
      - name: Guarda do índice FTS (PainelEmailAI)
        if: always()
        run: ./scripts/guarda-drift-fts.sh prisma/migrations

      # Guarda contra `ADD COLUMN ... NOT NULL` sem `DEFAULT`.
      #
      # A regra vive em scripts/guarda-not-null-sem-default.sh, que documenta o
      # porquê e tem teste próprio (src/lib/guarda-not-null-sem-default.test.ts)
      # — mesma convenção da guarda acima, pela mesma razão: shell inline aqui
      # não é exercitado por nada e pode parar de casar sem ninguém notar.
      #
      # O que ela pega: coluna obrigatória acrescentada a tabela que já tem
      # linhas. O Postgres recusa com 23502, o start é
      # `prisma migrate deploy && next start`, e o `&&` transforma isso em app
      # em loop de restart — não em "migration pendente".
      #
      # Também sem depender do install: find + awk.
      - name: Guarda de NOT NULL sem DEFAULT em coluna nova
        if: always()
        run: ./scripts/guarda-not-null-sem-default.sh prisma/migrations

      # GATE, e não aviso — ao contrário do passo seguinte, e por um motivo
      # estreito: skill quebrada falha SILENCIOSAMENTE. Não derruba build, não
      # reprova teste, não aparece em lint. Ela simplesmente não carrega na
      # próxima sessão do Claude Code, e quem depende do método continua
      # achando que o está seguindo.
      #
      # A #327 ficou 25,1 h versionando a versão errada da onix-entrega-segura
      # sem que nada acusasse — é esse buraco que este passo fecha.
      #
      # Regras em scripts/guarda-skills.sh, com teste próprio
      # (src/lib/guarda-skills.test.ts): pasta == `name`, frontmatter abrindo
      # na linha 1 e fechando, `name`/`description`/`version`/`updated`
      # presentes, UTF-8 sem caractere de controle, e quebra de linha final.
      #
      # Sai 0 quando .claude/skills/ não existe — a guarda não pode reprovar a
      # branch em que ela própria entra.
      #
      # Também sem depender do install: bash + awk + iconv + tr.
      # Desde a #331 a guarda também confere o sha256 de cada SKILL.md contra
      # .claude/skills/MANIFESTO.md. As outras cinco regras provam que o
      # arquivo é BEM-FORMADO; nenhuma prova que é o arquivo CERTO — um
      # `version: 2.2` com o conteúdo da 2.0 passa em todas elas. Mudou uma
      # skill de propósito? `./scripts/atualiza-manifesto.sh` e commite junto.
      - name: Guarda de integridade das skills (.claude/skills)
        if: always()
        run: ./scripts/guarda-skills.sh .claude/skills

      # AVISO, não gate — e a diferença é decisão, não descuido.
      #
      # Confere se os modelos que docs/onix-co-estado.md cita ainda existem em
      # prisma/schema.prisma. Documentação desatualizada NÃO pode bloquear PR
      # de código: a PR que renomeia um modelo está certa, a doc é que ficou
      # para trás, e reprovar por isso empurra quem está no meio de outra
      # tarefa a "consertar" a doc às pressas — que é como documentação vira
      # ficção com aparência de revisada.
      #
      # Por isso o script SEMPRE sai 0 e o sinal é `::warning::`, que aparece
      # na PR e no summary sem reprovar nada. Se um dia isto virar gate, que
      # seja decisão explícita — não efeito colateral de mexer aqui.
      #
      # Tem teste próprio (src/lib/aviso-doc-modelos.test.ts), e o teste
      # cobre o "sai 0 mesmo com divergência" junto com a detecção: num aviso
      # que nunca fica vermelho, deixar de detectar é invisível.
      - name: Aviso — doc de estado × schema (não bloqueia)
        if: always()
        run: ./scripts/aviso-doc-modelos.sh docs/onix-co-estado.md prisma/schema.prisma

      # AVISO, não gate — mesma decisão do passo acima, por razão própria:
      # "está na hora de revisar o método" não pode reprovar a PR de outra
      # pessoa, que não tem nada a ver com isso. Gate aqui empurraria quem
      # está no meio de outra tarefa a fazer a revisão às pressas, que é o
      # defeito exato que a revisão por calendário existe para evitar.
      #
      # A seção 10 da onix-entrega-segura manda revisá-la a cada 10 PRs
      # fechadas. A regra estava em prosa e o contador era linha à mão em
      # docs/onix-co-estado.md — o mesmo arquivo que listava como pendentes
      # três itens já entregues pelas #316, #322 e #324. Contador que depende
      # de alguém lembrar de contar não é calendário, é intenção.
      #
      # MARCO ZERO: vem de .claude/skills/MARCO-ZERO, FONTE ÚNICA — não está
      # escrito aqui de propósito. Antes ele vivia neste step E na doc, e nada
      # amarrava os dois; um sha desatualizado não seria relido por ninguém e o
      # contador passaria a contar do ponto errado, em silêncio. A contagem
      # NÃO é retroativa; a justificativa está em docs/onix-co-estado.md.
      #
      # Conta commits da main desde o marco (squash + main linear ⇒ 1 commit
      # ≈ 1 PR). Precisa do histórico, que o fetch-depth: 0 lá em cima traz.
      # Tem teste próprio (src/lib/aviso-revisao-skill.test.ts), que cobre o
      # "sai 0 sempre" junto com a detecção.
      - name: Aviso — revisão da skill a cada 10 PRs (não bloqueia)
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/aviso-revisao-skill.sh "$BASE_SHA" 10

      # AVISO, não gate — e aqui a distinção é mais forte que nos outros dois:
      # PR demorada não é PR errada. Uma 🔴 esperando decisão do Eduardo DEVE
      # esperar; travá-la seria punir o processo funcionando. O alarme torna a
      # espera VISÍVEL, não a encurta à força.
      #
      # A #326 mediu: mediana 🟢 1,0 h · 🟡 1,0 h · 🔴 2,8 h · geral 1,2 h. O
      # gargalo não é velocidade, é a CAUDA LONGA — e ela é invisível: a #327
      # ficou 25,1 h publicando a skill errada, 21× a mediana, com CI verde o
      # tempo todo. "Aberta" e "esquecida" têm a mesma cara na lista de PRs.
      #
      # Limiares calibrados nesses números, com folga sobre o p90 de cada
      # faixa (avisar cedo demais ensina a ignorar o aviso):
      #   🟢 8 h · 🟡 12 h · 🔴 48 h, esta última pedindo o bloqueio NOMEADO.
      #
      # O aviso reporta o MÚLTIPLO da mediana, não só as horas: "12 h" não diz
      # nada sozinho; "12× o tempo típico desta faixa" diz que algo travou.
      #
      # Tem teste próprio (src/lib/aviso-pr-envelhecendo.test.ts).
      - name: Aviso — PR envelhecendo além da mediana da faixa (não bloqueia)
        if: always()
        env:
          CRIADA_EM: ${{ github.event.pull_request.created_at }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/aviso-pr-envelhecendo.sh "$CRIADA_EM" "$BASE_SHA" "$HEAD_SHA"
