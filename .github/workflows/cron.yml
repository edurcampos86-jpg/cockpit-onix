name: Cockpit Crons

# Substitui os [[crons]] do railway.toml, que o Railway parou de processar
# (a doc atual só fala em `cronSchedule` singular per-service, e o canvas
# do projeto não tem services dedicados a cron).
#
# Cada schedule abaixo dispara o workflow inteiro. O job `dispatch` lê
# `github.event.schedule` e decide quais endpoints chamar — assim mantemos
# UM workflow só (mais fácil de manter que 5+ arquivos).
#
# Setup necessário (1 vez):
# - Repo Settings → Secrets and variables → Actions:
#   - Secret  CRON_SECRET   (mesmo valor que vai no Railway Variables)
#   - Variable APP_BASE_URL (ex: https://cockpit-onix-production.up.railway.app)
#
# workflow_dispatch permite disparar manualmente da aba Actions.

on:
  schedule:
    - cron: '*/5 * * * *'   # datacrazy-poll (mensagens WhatsApp)
    - cron: '*/15 * * * *'  # google-calendar-poll
    - cron: '*/30 * * * *'  # outlook-poll + datacrazy-atividades-poll + integration-audit
    - cron: '0 23 * * 0'    # retrospectiva-semanal (dom 20:00 Bahia / 23:00 UTC)
    - cron: '0 4 * * 2'     # btg-movements-poll (ter 01:00 Bahia / 04:00 UTC — fora de pico)
    - cron: '0 9 * * *'     # btg-balances-poll (diário 06:00 Bahia / 09:00 UTC — saldoConta)
    - cron: '0 7 * * 0'     # btg-cadastral-poll (dom 04:00 Bahia / 07:00 UTC — off-peak, incremental)
    - cron: '0 11 * * *'    # alertas-clientes (diário 08:00 Bahia / 11:00 UTC — após saldos)
    - cron: '0 7 * * *'     # backup-daily → B2 (diário 04:00 Bahia / 07:00 UTC)
    - cron: '0 8 1 * *'     # config-audit-retencao (dia 1 do mês, 05:00 Bahia / 08:00 UTC)
    - cron: '0 13 * * 1-5'  # btg-freshness (seg-sex 10:00 Bahia / 13:00 UTC — heartbeat de dados BTG, após balances-poll)
    - cron: '30 3 * * *'    # meta-sync (diário 00:30 Bahia / 03:30 UTC — snapshots Marketing API D-1 + matriz CAC)
    # Backup do Postgres roda em DOIS destinos independentes (regra 3-2-1):
    # .github/workflows/db-backup.yml (06:00 UTC diário, pg_dump direto → R2)
    # e o schedule 0 7 * * * acima (app → B2, GFS). A restauração é validada
    # exclusivamente em Postgres descartável no restore-drill.yml — nunca no
    # banco ou no volume de produção.
  workflow_dispatch:
    inputs:
      paths:
        description: 'Paths separados por espaço (ex: "/api/cron/datacrazy-poll /api/cron/outlook-poll"). Vazio = roda todos.'
        required: false
        default: ''

concurrency:
  # Evita runs paralelos do MESMO schedule (se o anterior demorar mais que
  # o intervalo). Schedules diferentes continuam podendo rodar em paralelo.
  group: cron-${{ github.event.schedule || github.event.inputs.paths }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # 12min: btg-cadastral-poll pode levar ~9min (rate limit 55/min). Os demais
    # schedules terminam em segundos.
    timeout-minutes: 12
    steps:
      - name: Resolve paths
        id: resolve
        run: |
          SCHEDULE='${{ github.event.schedule }}'
          MANUAL='${{ github.event.inputs.paths }}'
          if [ -n "$MANUAL" ]; then
            PATHS="$MANUAL"
          else
            case "$SCHEDULE" in
              "*/5 * * * *")
                PATHS="/api/cron/datacrazy-poll"
                ;;
              "*/15 * * * *")
                PATHS="/api/cron/google-calendar-poll"
                ;;
              "*/30 * * * *")
                PATHS="/api/cron/outlook-poll /api/cron/datacrazy-atividades-poll /api/cron/juridico-email-poll /api/cron/integration-audit"
                ;;
              # ─────────────────────────────────────────────────────────────
              # SEM SCHEDULE, POR ORA — /api/cron/auto-encerrar,
              # /api/cron/triar-emails e /api/cron/boot-do-dia existem e
              # funcionam, mas são disparadas SÓ manualmente, pelo
              # workflow_dispatch acima (informar o path no campo "paths").
              #
              # CORREÇÃO DE REGISTRO: a versão anterior deste comentário dizia
              # que as 3 rotas "foram deletadas em 1bbbfcd (2026-05-01)" e que
              # o 404 durava "~3 meses". Ambas erradas. O que os fatos mostram:
              #
              #   git log origin/main -- src/app/api/cron/auto-encerrar/route.ts
              #     → 0 commits (idem triar-emails, boot-do-dia e as libs
              #       auto-encerrar.ts / boot-do-dia.ts)
              #
              # As rotas NUNCA existiram na main. Foram escritas em f9409a4
              # (2026-04-21) na branch feat/painel-automacoes, que nunca foi
              # mergeada; 1bbbfcd também vive nessa branch, então a "deleção"
              # nunca chegou à produção porque o código também nunca chegou.
              #
              # O que houve de fato: a PR #198 (58fa570, 2026-06-21) adicionou
              # os 3 paths a este workflow apontando para rotas que não
              # existiam na main. Resultado: 404 a cada tick de 21/06 a 30/07
              # — ~6 semanas, escondido atrás de um `::warning::`.
              #
              # Por isso a estreia é conservadora: este código nunca rodou
              # contra dados reais. As três escrevem em produção e a triagem
              # consome API Claude (até 20 e-mails por usuário por execução).
              #
              # Para agendar, depois de validar no disparo manual, devolver:
              #   '*/15 * * * *'  → + auto-encerrar + triar-emails
              #   '30 10 * * 1-5' → boot-do-dia (seg-sex 07:30 Bahia)
              # ─────────────────────────────────────────────────────────────
              "0 23 * * 0")
                PATHS="/api/cron/retrospectiva-semanal"
                ;;
              "0 4 * * 2")
                PATHS="/api/cron/btg-movements-poll"
                ;;
              "0 9 * * *")
                PATHS="/api/cron/btg-balances-poll"
                ;;
              "0 7 * * 0")
                PATHS="/api/cron/btg-cadastral-poll"
                ;;
              "0 11 * * *")
                PATHS="/api/cron/alertas-clientes"
                ;;
              "0 7 * * *")
                PATHS="/api/cron/backup-daily"
                ;;
              # Faxina mensal. Aproveita o schedule que já existe em vez de
              # criar um novo: mesma cadência, mesma natureza (housekeeping
              # off-peak), e cada `cron:` novo dispara o workflow inteiro.
              # config-audit-retencao termina em milissegundos.
              "0 8 1 * *")
                PATHS="/api/cron/config-audit-retencao"
                ;;
              "0 13 * * 1-5")
                PATHS="/api/cron/btg-freshness"
                ;;
              "30 3 * * *")
                PATHS="/api/cron/meta-sync"
                ;;
              *)
                echo "Schedule '$SCHEDULE' não mapeado — nenhum endpoint executado."
                PATHS=""
                ;;
            esac
          fi
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
          echo "Vai disparar: $PATHS"

      - name: Hit endpoints
        if: steps.resolve.outputs.paths != ''
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::APP_BASE_URL não configurado (Repo Settings → Variables)"
            exit 1
          fi
          # Duas contagens porque são dois tipos de falha com tratamento
          # oposto — ver o `case "$HTTP_CODE"` abaixo.
          FAIL=0   # transitória (5xx, timeout, DNS) → warning
          HARD=0   # estrutural (404/405/501)        → exit 1
          # Salva a última resposta em /tmp/last_*.txt (persiste entre steps no
          # mesmo job). Step "Notify Slack — BTG" consome esses arquivos quando
          # o schedule do dia é o cron weekly BTG (1 path só, sem ambiguidade).
          for path in ${{ steps.resolve.outputs.paths }}; do
            URL="${BASE_URL}${path}"
            echo "[$(date '+%H:%M:%S')] GET $URL"
            # btg-cadastral-poll é rate-limited (55/min) e processa ~480 contas
            # por run → precisa de janela maior. Os demais paths terminam em
            # segundos; 120s é teto de segurança.
            case "$path" in
              */btg-cadastral-poll) MAXT=540 ;;
              *) MAXT=120 ;;
            esac
            # Zera a resposta anterior ANTES do curl. Sem isso, um curl que
            # falha não escreve em /tmp/resp.txt e o `head` abaixo relê o corpo
            # do endpoint anterior — o log passa a atribuir a resposta de um
            # endpoint a outro (visto em 2026-07-30: auto-encerrar e
            # triar-emails, ambos 404, imprimindo o JSON do google-calendar-poll).
            : > /tmp/resp.txt
            # Sem -f: queremos o código real (404, 500) e o corpo do erro. Com
            # -f o curl aborta sem gravar o corpo e o `||` mascarava qualquer
            # status de erro como "000". O `||` continua cobrindo falha de
            # transporte de verdade (timeout, DNS), onde não há status HTTP.
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time "$MAXT" \
              "$URL") || HTTP_CODE="000"
            BODY=$(head -c 2000 /tmp/resp.txt 2>/dev/null)
            echo "  → HTTP $HTTP_CODE"
            echo "  → body: $BODY"
            echo "$HTTP_CODE" > /tmp/last_code.txt
            echo "$path"      > /tmp/last_path.txt
            case "$HTTP_CODE" in
              200)
                ;;
              401|403|404|405|501)
                # Falha ESTRUTURAL: o path não existe, não aceita GET, ou a
                # autenticação está mal configurada. Nada disso é blip de rede
                # — nenhum se conserta sozinho no próximo tick, todos exigem um
                # commit ou uma variável de ambiente. Precisa ser barulhento:
                # foi exatamente este silêncio que deixou auto-encerrar,
                # triar-emails e boot-do-dia devolvendo 404 a cada tick por
                # semanas sem ninguém perceber.
                #
                # 401/403 entraram junto com a guarda de cron passando a falhar
                # FECHADA: se CRON_SECRET sumir do Railway, ou divergir do
                # secret do GitHub, as 19 rotas passam a recusar. Sem isso aqui,
                # essa recusa apareceria como `::warning::` e o job seguiria
                # verde — trocaríamos um silêncio por outro.
                echo "::error::$path retornou HTTP $HTTP_CODE — falha estrutural. 404/405: path errado ou rota fora do ar. 401/403: CRON_SECRET ausente no Railway ou divergente do secret do GitHub."
                HARD=$((HARD+1))
                ;;
              *)
                # Falha TRANSITÓRIA: 5xx, timeout, DNS ("000"). Pode ser blip
                # e costuma se resolver no próximo tick — segue warning, para
                # não gerar email do GitHub a cada oscilação de rede.
                echo "::warning::$path retornou HTTP $HTTP_CODE"
                FAIL=$((FAIL+1))
                ;;
            esac
          done
          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::$FAIL endpoint(s) com falha transitória neste tick"
          fi
          # Falha transitória não usa exit 1 — não queremos email do GitHub a
          # cada blip de rede. Acompanhar via logs do workflow e
          # /api/backoffice/sync-logs no Cockpit.
          if [ "$HARD" -gt 0 ]; then
            echo "::error::$HARD endpoint(s) com falha estrutural — o workflow está chamando rota que não existe."
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # Notify Slack — APENAS para o cron semanal BTG.
      #
      # Único cron deste workflow com notificação Slack. Justificativa:
      # BTG é semanal (não roda a cada 5/15/30min), então o sinal não vira
      # ruído. E é a única integração onde silêncio = perda de dado
      # invisível — sem o ping, MovimentacaoBtg pode ficar vazia por
      # semanas sem ninguém notar.
      #
      # Sucesso E falha são notificados (não só falha): Eduardo quer ver
      # vida do cron pelo menos 1x/semana. Mensagens distintas pra não
      # confundir com smoke alerts.
      # ─────────────────────────────────────────────────────────────────

      - name: Notify Slack — BTG sync semanal
        if: always() && contains(steps.resolve.outputs.paths, '/api/cron/btg-movements-poll')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL não configurado — pulando."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          CODE=$(cat /tmp/last_code.txt 2>/dev/null || echo "000")
          BODY=$(cat /tmp/resp.txt 2>/dev/null || echo "")

          # Tenta parsear o body como JSON (resposta do handler). Se falhar,
          # cai pra erro de transporte (HTTP != 200).
          OK=$(echo "$BODY" | jq -r '.ok // false' 2>/dev/null || echo "false")
          CREATED=$(echo "$BODY" | jq -r '.recordsCreated // 0' 2>/dev/null || echo "0")
          SKIPPED=$(echo "$BODY" | jq -r '.recordsSkipped // 0' 2>/dev/null || echo "0")
          ORPHANED=$(echo "$BODY" | jq -r '.recordsOrphaned // 0' 2>/dev/null || echo "0")
          DURATION=$(echo "$BODY" | jq -r '.durationMs // 0' 2>/dev/null || echo "0")
          ERR_MSG=$(echo "$BODY" | jq -r '.errorMessage // (.errors[0].motivo // "")' 2>/dev/null || echo "")

          if [ "$CODE" = "200" ] && [ "$OK" = "true" ]; then
            MSG=":white_check_mark: BTG sync semanal — *${CREATED}* movimentações novas, ${SKIPPED} duplicadas, ${ORPHANED} órfãs · ${DURATION}ms · <${RUN_URL}|run>"
          else
            FIRST_ERR="${ERR_MSG:-HTTP $CODE}"
            # Trunca pra evitar mensagem gigante no Slack
            FIRST_ERR=$(echo "$FIRST_ERR" | head -c 300)
            MSG=":rotating_light: *BTG SYNC FALHOU* — backup semanal de movimentações não rodou
          Erro: \`${FIRST_ERR}\`
          Run: <${RUN_URL}|ver detalhes>
          Próxima tentativa: terça que vem 04:00 UTC"
          fi

          PAYLOAD=$(jq -n --arg text "$MSG" '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
            && echo "Slack notificado." \
            || echo "::warning::Falha ao postar no Slack — verificar SLACK_WEBHOOK_URL"
